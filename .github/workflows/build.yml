name: Build Docker Image

# Build the multi-arch image and, on main, push it to GHCR. Pull requests build only (no push).
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write # Trivy uploads its CVE report (SARIF) to the Security tab

env:
  IMAGE: ghcr.io/${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Boot smoke test: a green build is not a booting container. Build the amd64
  # image, run it, and confirm it serves /api/health before we push :latest /
  # the release tag. The push job depends on this, so a non-booting image can
  # never reach the registry.
  smoke:
    name: Boot smoke test (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build amd64 image (load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: bombvault:smoke
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container + health check
        run: |
          docker run -d --name bv-smoke \
            -e APP_KEY="$(openssl rand -hex 32)" \
            -e HTTP_ONLY=true \
            -p 3000:3000 bombvault:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "✓ container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "✗ container did not become healthy in time"
          docker logs bv-smoke || true
          exit 1
      - name: Verify tini is PID 1 (zombie reaper, #35)
        run: |
          # BombVault shells out to restic, which forks rclone for off-site repos.
          # A cancelled/killed restic orphans its rclone child onto PID 1; if PID 1
          # is not a reaping init those pile up as [rclone] <defunct> (#35). tini as
          # PID 1 reaps them. /proc/1/comm is the live proof the ENTRYPOINT took.
          pid1=$(docker exec bv-smoke cat /proc/1/comm)
          echo "PID 1 is: $pid1"
          if [ "$pid1" != "tini" ]; then
            echo "✗ PID 1 is '$pid1', not tini — the zombie reaper is missing (#35 would regress)"
            exit 1
          fi
          echo "✓ tini is PID 1 — orphaned rclone/ssh grandchildren get reaped"
      # Non-blocking CVE scan of the just-built image. Reports HIGH/CRITICAL
      # findings to the Security tab (SARIF). Deliberately does NOT fail the
      # build (exit-code 0): most findings live in the upstream base image and
      # can't be fixed here, so this is visibility, not a release gate.
      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bombvault:smoke
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload Trivy results to the Security tab
        if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Cleanup
        if: always()
        run: docker rm -f bv-smoke || true

  build:
    name: Build (amd64 + arm64)
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Push only on main / manual runs, never from pull requests.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Stamp a meaningful version into the binary. Tag builds use the tag
      # (e.g. v3.1.0); main builds (which publish :latest) use the latest release
      # tag plus the short SHA (e.g. v3.1.0+main.4c0c987) instead of the literal
      # "main", so the log banner + WebUI show a real version (issue #22).
      - name: Compute version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${{ github.ref_name }}"
          else
            tag=$(gh release view -R "${{ github.repository }}" --json tagName --jq .tagName 2>/dev/null || true)
            sha=$(printf '%s' "${{ github.sha }}" | cut -c1-7)
            if [ -n "$tag" ]; then v="${tag}+main.${sha}"; else v="0.0.0+main.${sha}"; fi
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "computed version: $v"
      - name: Build multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.v }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply-chain attestations: SLSA build provenance + an SBOM, attached
          # to the image in the registry so consumers can verify how it was built
          # and what it contains.
          provenance: true
          sbom: true


